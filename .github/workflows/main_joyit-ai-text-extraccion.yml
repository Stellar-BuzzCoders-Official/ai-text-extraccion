# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - joyit-ai-text-extraccion

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://joyittextextraction.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_ab075059e19242ab8a0f5f54eaa1816e }}
        password: ${{ secrets.AzureAppService_ContainerPassword_c9768891ef98483c9613e0c52954247d }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: joyittextextraction.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_ab075059e19242ab8a0f5f54eaa1816e }}/joyit-cn-ai-text-extraction:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'joyit-ai-text-extraccion'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_aee0862e57df4a24ab5ca0334ab3b2fc }}
        images: 'joyittextextraction.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_ab075059e19242ab8a0f5f54eaa1816e }}/joyit-cn-ai-text-extraction:${{ github.sha }}'