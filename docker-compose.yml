services:
  joyit-cn-ai-text-extraction:
    container_name: joyit-cn-ai-text-extraction
    build: .
    ports:
      - "7000:7000"
    networks:
      - joyit_screening_net
    volumes:
      - ./app.py:/app/app.py
      - ./src:/app/src
    environment:
      - FLASK_DEBUG=1
      - FLASK_APP=app.py
      - API_STORAGE_PORT
      - API_STORAGE_HOST
      - API_STORAGE_URL
    expose:
      - 7272

networks:
  joyit_screening_net:
    external: true